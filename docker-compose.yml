version: '3.8'
services:
  server:
    image: agent-office/server:latest
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=sqlite:/data/office.db
      - REDIS_URL=redis://redis:6379
      - HOST=0.0.0.0
      # Agents use an OpenAI-compatible API inside Docker (the Claude/Codex CLIs are not installed in the image)
      - LLM_PROVIDER=openai
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/data
  
  client:
    image: agent-office/ui:latest
    build:
      context: .
      dockerfile: packages/ui/Dockerfile
    ports:
      - "80:80"
    environment:
      - API_URL=http://server:3000
  
  redis:
    image: redis:alpine
